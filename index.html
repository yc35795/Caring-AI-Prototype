<!doctype html>
<html lang="en">
<head>

<title>Caring AI</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2B3132}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;overflow:hidden;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.35);background:#F6F4F0}
#stage{position:absolute;top:0;left:0;transform-origin:0 0}
@media (max-width:600px){html,body{background:#F6F4F0}#frame{border-radius:0;box-shadow:none}}
</style>
<style id="screen-style"></style>
</head>
<body>
<div id="frame"><div id="stage"></div></div>
<template data-screen="Main.dc.html"><div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F6F4F0; color: #1E2A2B; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">

</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; padding: 16px 24px 40px">

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; color: #5A6566">Tuesday, November 3</span>
<h1 style="margin: 0; font-size: 28px; line-height: 1.2">Good afternoon, Jamie</h1>
</div>

<section aria-labelledby="due-h" style="display: flex; flex-direction: column; gap: 18px; padding: 22px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(30,42,43,0.06), 0 4px 16px rgba(30,42,43,0.06)">

</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="due-h" style="margin: 0; font-size: 24px; line-height: 1.2">Vitamin D3 1,000 IU</h2>
<span style="font-size: 16px; color: #5A6566">1 softgel with lunch</span>
</div>
<sc-if value="{{ dueOpen }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ toggleDue }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 16px; border: none; background: #355443; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Mark as taken</button>

<sc-if value="{{ dueDone }}" hint-placeholder-val="{{ false }}">

</sc-if>
</section>

<section aria-labelledby="later-h" style="display: flex; flex-direction: column; gap: 12px">

</div>

<li style="{{ d.rowStyle }}">
<span style="width: 68px; flex-shrink: 0; font-size: 15px; color: #5A6566">{{ d.time }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">{{ d.name }}</span><span style="font-size: 15px; color: #5A6566">{{ d.note }}</span></span>
<button onClick="{{ d.toggle }}" aria-label="{{ d.aria }}" aria-pressed="{{ d.isTaken }}" style="{{ d.checkStyle }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</li>
</sc-for>
</ul>
<span style="font-size: 15px; color: #5A6566; padding: 0 4px">Taken this morning: Metformin and Lisinopril, 8:10 AM</span>
</section>

<section aria-labelledby="appt-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="appt-h" style="margin: 0; font-size: 19px">Next appointment</h2>
<a href="Appointment.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 16px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(30,42,43,0.06); color: #1E2A2B; text-decoration: none">
<span aria-hidden="true" style="width: 56px; height: 64px; flex-shrink: 0; border-radius: 14px; background: #E1ECF6; color: #1F4E79; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 13px; font-weight: 700">THU</span><span style="font-size: 24px; font-weight: 700; line-height: 1">5</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Dr. Priya Shah</span><span style="font-size: 15px">Cardiology follow-up</span><span style="font-size: 15px; color: #5A6566">10:30 AM · in 2 days</span><span style="font-size: 14px; font-weight: 700; color: #355443">Prep: 2 questions · summary draft</span></span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</section>

<section aria-labelledby="read-h" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 id="read-h" style="margin: 0; font-size: 19px">Latest readings</h2>
<a href="Health.dc.html" style="font-size: 15px; font-weight: 700; padding: 8px 0">See all</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(30,42,43,0.06)">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px"><span style="font-size: 14px; color: #5A6566">Blood pressure</span><span style="font-size: 22px; font-weight: 700">132/84</span><span style="font-size: 13px; color: #5A6566">Today, 8:05 AM</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-left: 1px solid #EEEAE3"><span style="font-size: 14px; color: #5A6566">Blood sugar</span><span style="font-size: 22px; font-weight: 700">118 <span style="font-size: 14px; font-weight: 400">mg/dL</span></span><span style="font-size: 13px; color: #5A6566">Before breakfast</span></div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="NotebookNewV21.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; border: 1.5px solid #C9C2B7; color: #1E2A2B; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A3F0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Log a symptom</a>
<a href="AskAIHomeV2.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; border: 1.5px solid #C9C2B7; color: #1E2A2B; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4B3B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Ask AI</a>
</div>

</main>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 8px 4px 24px; background: #FFFFFF; border-top: 1px solid #E2DDD5">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #355443; font-size: 14px; font-weight: 700"><span style="display: flex; padding: 4px 14px; border-radius: 999px; background: #DDE8DF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
<a href="CalendarMonth.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #5A6566; font-size: 14px"><span style="display: flex; padding: 4px 14px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Calendar</a>
<a href="NotebookV21.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #5A6566; font-size: 14px"><span style="display: flex; padding: 4px 14px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3v18M12.5 8h3M12.5 12h3"></path></svg></span>Notebook</a>
<a href="Health.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #5A6566; font-size: 14px"><span style="display: flex; padding: 4px 14px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>Health</a>
<a href="AskAIHomeV2.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; text-decoration: none; color: #5A6566; font-size: 14px"><span style="display: flex; padding: 4px 14px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span>Ask AI</a>
</nav>

</div></template>
<template data-screen="CalendarMonth.dc.html"><div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F6F4F0; color: #1E2A2B; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 4px">
<button aria-label="Caring for Rosa Alvarez. Switch person" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 14px 4px 4px; background: #FFFFFF; border: 1px solid #E2DDD5; border-radius: 999px; color: #1E2A2B; font-size: 16px; font-weight: 700; cursor: pointer"><span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #F3DCC4; color: #6B3A12; display: flex; align-items: center; justify-content: center; font-size: 14px">RA</span>Rosa Alvarez<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<a href="Profile.dc.html" aria-label="Your profile and privacy settings" style="width: 46px; height: 46px; border-radius: 50%; background: #355443; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; text-decoration: none">J</a>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; padding: 16px 24px 40px">

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px">Calendar</h1>
<button aria-label="Add appointment or reminder" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #355443; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<nav aria-label="Calendar view" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E5DE; border-radius: 14px">

</nav>
</div>

<section aria-label="November 2026" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(30,42,43,0.06)">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #1E2A2B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<h2 style="margin: 0; font-size: 18px">November 2026</h2>
<button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #1E2A2B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 13px; color: #5A6566">
<span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
<sc-if value="{{ c.blank }}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
<sc-if value="{{ c.real }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ c.select }}" aria-label="{{ c.aria }}" aria-pressed="{{ c.isSelected }}" style="{{ c.cellStyle }}">
<span>{{ c.day }}</span>
<span aria-hidden="true" style="{{ c.dotStyle }}"></span>
</button>
</sc-if>
</sc-for>
</div>
<span style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 0; font-size: 14px; color: #5A6566"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #1F4E79"></span>Appointment</span>
</section>

<section aria-labelledby="agenda" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="agenda" style="margin: 0; font-size: 19px">{{ selectedLabel }}</h2>

<span style="font-size: 18px; font-weight: 700">{{ appt.title }}</span>
<span style="font-size: 15px">{{ appt.who }}</span>
</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-if>
<sc-if value="{{ noAppt }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 16px; color: #5A6566">No appointments this day.</span>

<div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(30,42,43,0.06)">

<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #FCEBD7; color: #7A3F0A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="2.5" width="7" height="19" rx="3.5" transform="rotate(45 12 12)"></rect><path d="M9.5 9.5l5 5"></path></svg></span>
<span style="flex: 1; font-size: 16px">5 medication doses</span>
<span style="font-size: 15px; font-weight: 700; color: #355443">{{ medsLabel }}</span>
</button>
<sc-if value="{{ medsOpen }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ doses }}" as="m" hint-placeholder-count="4">
<a href="Medication.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 16px; border-top: 1px solid #F0ECE5; color: #1E2A2B; text-decoration: none">
<span style="width: 68px; flex-shrink: 0; font-size: 15px; color: #5A6566">{{ m.time }}</span>
<span style="flex: 1; font-size: 16px">{{ m.names }}</span>
</a>
</sc-for>
</sc-if>
</div>
</section>

</main>

enderVals() {\n    const sel = this.state.selected;\n    const TODAY = 3;\n    const appts = {\n      5: { time: '10:30 AM', title: 'Cardiology follow-up', who: 'Dr. Priya Shah \u00b7 Lakeside Heart Clinic' },\n      12: { time: '3:00 PM', title: 'Physical therapy', who: 'Riverside Rehab \u00b7 Room 4' },\n      16: { time: '9:00 AM', title: 'Fasting blood test', who: 'Community Lab \u00b7 North branch' },\n      24: { time: '2:00 PM', title: 'Primary care check-up', who: 'Dr. Daniel Lee \u00b7 Oak Family Medicine' }\n    };\n    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    const cells = [];\n    for (let i = 1; i <= 35; i++) {\n      if (i > 30) { cells.push({ blank: true, real: false }); continue; }\n      const d = i;\n      const isSel = d === sel;\n      const isToday = d === TODAY;\n      const a = appts[d];\n      let style = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:48px;padding:0;border-radius:14px;font-size:16px;cursor:pointer;';\n      if (isSel) style += 'background:#355443;color:#FFFFFF;font-weight:700;border:2px solid #355443;';\n      else if (isToday) style += 'background:transparent;color:#355443;font-weight:700;border:2px solid #355443;';\n      else style += 'background:transparent;color:#1E2A2B;border:2px solid transparent;';\n      const dot = 'width:6px;height:6px;border-radius:50%;' + (a ? (isSel ? 'background:#FFFFFF;' : 'background:#1F4E79;') : 'background:transparent;');\n      cells.push({\n        blank: false, real: true, day: String(d), isSelected: isSel, cellStyle: style, dotStyle: dot,\n        aria: dayNames[(d - 1) % 7] + ', November ' + d + (isToday ? ', today' : '') + (a ? ', 1 appointment' : ''),\n        select: () => this.setState({ selected: d })\n      });\n    }\n    const appt = appts[sel] || false;\n    return {\n      cells,\n      selectedLabel: dayNames[(sel - 1) % 7] + ', November ' + sel + (sel === TODAY ? ' \u0       if (!newEl.hasAttribute(oa[i].name)) oldEl.removeAttribute(oa[i].name);
    }
    var na = newEl.attributes;
    for (var j = 0; j < na.length; j++) {
      if (oldEl.getAttribute(na[j].name) !== na[j].value) oldEl.setAttribute(na[j].name, na[j].value);
    }
    oldEl.__h = newEl.__h;
    oldEl.__p = newEl.__p;
    bind(oldEl);
    morphChildren(oldEl, Array.prototype.slice.call(newEl.childNodes));
    applyProps(oldEl, oldEl.__p, false);
  }
  function morphChildren(parent, newNodes) {
    var oldNodes = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < newNodes.length; i++) {
      var o = oldNodes[i], n = newNodes[i];
      if (!o) { parent.appendChild(n); bindTree(n); }
      else if (same(o, n) && o.nodeType !== 8) patch(o, n);
      else { parent.replaceChild(n, o); bindTree(n); }
    }
    for (var k = newNodes.length; k < oldNodes.length; k++) parent.removeChild(oldNodes[k]);
  }

  var stage = document.getElementById('stage');
  var screenStyle = document.getElementById('screen-style');
  var current = null, inst = null, pending = false, mounted = false;

  function render() {
    pending = false;
    if (!inst) return;
    var vals = inst.renderVals ? inst.renderVals() : {};
    var nodes = build(SCREENS[current].tpl.content.childNodes, vals || {});
    if (!mounted) {
      stage.textContent = '';
      for (var i = 0; i < nodes.length; i++) { stage.appendChild(nodes[i]); bindTree(nodes[i]); }
      mounted = true;
    } else {
      morphChildren(stage, nodes);
    }
    fit();
  }
  function schedule() { if (!pending) { pending = true; Promise.resolve().then(render); } }

  function normalize(name) {
    name = decodeURIComponent((name || '').replace(/^#/, '')).split('?')[0].split('#')[0].replace(/^\.?\//, '');
    if (!/\.dc\.html$/.test(name)) name += '.dc.html';
    return SCREENS[name] ? name : null;
  }
  function go(name, push) {
    var target = normalize(name) || START;
    current = target;
    screenStyle.textContent = SCREENS[target].css;
    document.title = SCREENS[target].title || 'Caring AI';
    var Cls = getClass(target);
    inst = new Cls();
    mounted = false;
    render();
    if (inst.componentDidMount) inst.componentDidMount();
    var hash = '#' + target.replace(/\.dc\.html$/, '');
    if (push && location.hash !== hash) history.pushState(null, '', hash);
    else if (!push) history.replaceState(null, '', hash);
  }

  stage.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || !stage.contains(a)) return;
    var href = a.getAttribute('href');
    if (/^https?:/i.test(href)) { e.preventDefault(); window.open(href, '_blank', 'noopener'); return; }
    if (href.charAt(0) === '#') {
      e.preventDefault();
      var t = href.length > 1 && stage.querySelector('[id="' + href.slice(1) + '"]');
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    e.preventDefault();
    if (normalize(href)) go(href, true);
  });
  stage.addEventListener('submit', function (e) { e.preventDefault(); });
  window.addEventListener('popstate', function () { go(location.hash, false); });

  function fit() {
    var root = stage.firstElementChild;
    if (!root) return;
    var w = root.offsetWidth || 390, h = root.offsetHeight || 844;
    var s = Math.min(window.innerWidth / w, window.innerHeight / h);
    if (window.innerWidth > 600) s = Math.min(s, 1);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    stage.style.transform = 'scale(' + s + ')';
    document.getElementById('frame').style.width = (w * s) + 'px';
    document.getElementById('frame').style.height = (h * s) + 'px';
  }
  window.addEventListener('resize', fit);

  go(location.hash || START, false);
})();

</script>
</body>
